<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="960" height="1200" font-family="Literata, Georgia, 'Times New Roman', serif">
  <!-- The framework of "Quantifying Semiotic Validity", drawn from the paper's abstract:
       inputs -> four dimensions -> Semantic Depth Index -> score and failure-mode coding. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 9 5 0 9z" fill="#2a2620"/>
    </marker>
  </defs>
  <rect width="480" height="600" fill="#fffdf8"/>
  <g fill="none" stroke="#2a2620" stroke-width="1.2">
    <!-- inputs -->
    <rect x="20" y="20" width="440" height="96" rx="3" fill="#f6efdf"/>
    <!-- four dimensions -->
    <rect x="20" y="152" width="212" height="84" rx="3" fill="#f6efdf"/>
    <rect x="248" y="152" width="212" height="84" rx="3" fill="#f6efdf"/>
    <rect x="20" y="252" width="212" height="84" rx="3" fill="#f6efdf"/>
    <rect x="248" y="252" width="212" height="84" rx="3" fill="#f6efdf"/>
    <!-- the index: a double rule in oxblood -->
    <rect x="70" y="378" width="340" height="74" rx="3" fill="#fbf3ea" stroke="#9e2b25" stroke-width="1.6"/>
    <rect x="75" y="383" width="330" height="64" rx="2" stroke="#9e2b25" stroke-width="0.6"/>
    <!-- outputs -->
    <rect x="20" y="494" width="212" height="86" rx="3" fill="#f6efdf"/>
    <rect x="248" y="494" width="212" height="86" rx="3" fill="#f6efdf"/>
    <!-- arrows -->
    <path d="M240 116v30" marker-end="url(#a)"/>
    <path d="M240 336v36" marker-end="url(#a)"/>
    <path d="M200 452l-58 36" marker-end="url(#a)"/>
    <path d="M280 452l58 36" marker-end="url(#a)"/>
  </g>

  <g fill="#2a2620">
    <text x="240" y="44" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#6b5f4b">INPUTS</text>
    <text x="240" y="66" text-anchor="middle" font-size="14">7 embedding models, 384D to 3072D</text>
    <text x="240" y="86" text-anchor="middle" font-size="14">FAISS (flat, HNSW) and Pinecone</text>
    <text x="240" y="106" text-anchor="middle" font-size="14">500 human-annotated concept pairs</text>

    <text x="36" y="176" font-size="12" fill="#9e2b25" letter-spacing="1">I</text>
    <text x="36" y="200" font-size="15" font-weight="600">Geometric coherence</text>
    <text x="36" y="222" font-size="12.5" font-style="italic" fill="#4a4234">cluster quality</text>

    <text x="264" y="176" font-size="12" fill="#9e2b25" letter-spacing="1">II</text>
    <text x="264" y="200" font-size="15" font-weight="600">Hierarchical structure</text>
    <text x="264" y="222" font-size="12.5" font-style="italic" fill="#4a4234">taxonomic preservation</text>

    <text x="36" y="276" font-size="12" fill="#9e2b25" letter-spacing="1">III</text>
    <text x="36" y="300" font-size="15" font-weight="600">Relational logic</text>
    <text x="36" y="322" font-size="12.5" font-style="italic" fill="#4a4234">analogy completion</text>

    <text x="264" y="276" font-size="12" fill="#9e2b25" letter-spacing="1">IV</text>
    <text x="264" y="300" font-size="15" font-weight="600">Interpretive alignment</text>
    <text x="264" y="322" font-size="12.5" font-style="italic" fill="#4a4234">human judgment correlation</text>

    <text x="240" y="412" text-anchor="middle" font-size="19" font-weight="600">Semantic Depth Index</text>
    <text x="240" y="434" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a4234">four dimensions, one score</text>

    <text x="126" y="522" text-anchor="middle" font-size="15" font-weight="600">Semiotic validity</text>
    <text x="126" y="544" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a4234">compared across models,</text>
    <text x="126" y="562" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a4234">indexes and domains</text>

    <text x="354" y="522" text-anchor="middle" font-size="15" font-weight="600">Failure-mode coding</text>
    <text x="354" y="544" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a4234">the 50 lowest-scoring pairs:</text>
    <text x="354" y="562" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a4234">patterns of semantic collapse</text>
  </g>
</svg>
